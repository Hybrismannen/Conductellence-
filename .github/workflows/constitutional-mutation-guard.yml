name: Conductellence Constitutional Mutation Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  mutation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect protected-surface changes
        id: paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          git diff --name-only "$BASE" "$HEAD" > changed.txt || true
          if grep -Eq '^(LAW/|appendices/|POLICY/|CONTROL-CATALOGUE/|GOVERNANCE/|LEGAL-REFERENCES/|LEGAL-RESOLVER/|INTERPRETATION/|SPETL/|SECURITY-TWIN/|GLOBAL-AUTHORITY-CORPUS/|REGULATORY-DRIFT/|EVIDENCE-AUTHORITY/|REVIEW-CATALOGUE/|RED-TEAM/|DISTRIBUTION/|RUNTIME-INTEGRATION/|ESTATE-REGISTRY/|AUDITS/|\.github/workflows/)' changed.txt; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce PR-only constitutional mutation on main
        if: github.event_name == 'push' && steps.paths.outputs.protected == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repo=os.environ["REPOSITORY"]
          sha=os.environ["COMMIT_SHA"]
          branch=os.environ.get("DEFAULT_BRANCH") or "main"
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/commits/{sha}/pulls"
          req=urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "conductellence-constitutional-mutation-guard",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  prs=json.load(response)
          except Exception as exc:
              print(f"FAIL: unable to verify commit-to-PR provenance: {exc}")
              print("Failing closed because protected-surface provenance is unavailable.")
              raise SystemExit(1)

          valid=[
              pr for pr in prs
              if pr.get("state")=="closed"
              and pr.get("merged_at")
              and pr.get("base",{}).get("ref")==branch
          ]
          if not valid:
              print("FAIL: protected Conductellence surfaces reached the default branch without verifiable merged-PR provenance.")
              print("Native branch protection is still required for pre-merge prevention.")
              raise SystemExit(1)

          print("PASS: protected-surface commit is associated with a merged PR targeting the default branch.")
          for pr in valid:
              print(f"  PR #{pr.get('number')}: {pr.get('html_url')}")
          PY

      - name: Confirm guarded path
        run: echo "Constitutional mutation guard evaluated."
