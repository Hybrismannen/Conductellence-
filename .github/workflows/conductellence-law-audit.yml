name: Conductellence Law Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  constitutional-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit canonical law integrity
        run: python3 AUDITS/audit_law_integrity.py

      - name: Audit exact legal reference integrity
        run: python3 AUDITS/audit_legal_reference_integrity.py

      - name: Audit Legal Integrity B-D clearance order
        run: python3 AUDITS/audit_legal_phase_clearance.py

      - name: Audit law-to-control coverage
        run: python3 AUDITS/audit_binding_coverage.py

      - name: Audit canonical root structure
        run: python3 AUDITS/audit_root_structure.py

      - name: Audit Phase B semantic review queue
        run: python3 AUDITS/audit_phase_b_semantic_queue.py

      - name: Audit Phase C fail-safe Legal Resolver
        run: python3 AUDITS/audit_phase_c_legal_resolver.py

      - name: Audit Phase D regulatory drift state
        run: python3 AUDITS/audit_phase_d_regulatory_drift.py

      - name: Audit foundational appendices and Global Authority Corpus
        run: python3 AUDITS/audit_foundational_appendices.py

      - name: Audit fully-automatable controls
        run: python3 AUDITS/audit_fully_automatable_controls.py

      - name: Audit SPETL evidence runtime
        run: python3 AUDITS/audit_spetl.py

      - name: Audit Security Twin
        run: python3 AUDITS/audit_security_twin.py

      - name: Audit Estate Registry
        run: python3 AUDITS/audit_estate_registry.py

      - name: Audit enforcement transition readiness
        run: python3 AUDITS/audit_enforcement_transition.py
