name: SPETL Custody Verifier

on:
  workflow_run:
    workflows: ["SPETL Independent Custodian"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch verification code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Read custody artifact from separate custodian run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: custody-package
          merge-multiple: true

      - name: Verify custody package and produce verification report
        run: |
          python3 SPETL/custody/gha_custody.py verify \
            custody-package \
            --expected-custody-run-id "${{ github.event.workflow_run.id }}" \
            --report verification-report.json \
            --verifier-run-id "${{ github.run_id }}" \
            --verifier-run-attempt "${{ github.run_attempt }}"

      - name: Preserve verification provenance
        id: verification_artifact
        uses: actions/upload-artifact@v4
        with:
          name: spetl-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Record verification artifact digest
        run: |
          echo "verification_artifact_id=${{ steps.verification_artifact.outputs.artifact-id }}"
          echo "verification_artifact_digest=${{ steps.verification_artifact.outputs.artifact-digest }}"
